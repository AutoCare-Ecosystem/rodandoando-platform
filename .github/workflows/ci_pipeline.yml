name: CI Pipeline - RodandoAndo

on:
  push:
    branches: [ main, develop, "feat/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality-and-tests:
    name: Linter, Security Audit & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest pytest-cov
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Run Ruff (PEP 8 & Static Linting)
        run: |
          if [ -d backend ]; then
            ruff check backend/
          else
            echo "Directorio backend/ aún no creado; omitiendo ruff."
          fi

      - name: Run Bandit (Static Security Analysis)
        run: |
          if [ -d backend/app ]; then
            bandit -r backend/app -ll
          else
            echo "Directorio backend/app aún no creado; omitiendo bandit."
          fi

      - name: Run Pytest (Unit & API Tests)
        run: |
          if [ -d backend/tests ]; then
            pytest backend/tests -v --cov=backend/app
          else
            echo "Suite backend/tests aún no creada; omitiendo pytest."
          fi
